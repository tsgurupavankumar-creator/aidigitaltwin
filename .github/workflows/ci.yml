name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # These are disposable, test-only fixtures used exclusively for CI. They do not grant access to production data.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_twin?schema=public
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  e2e-tests:
    # Real browser tests against a throwaway database: migrations + seed, then all 7 Playwright tests
    # (including the two that write data; this database exists only for this job). A failure fails CI.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # These are disposable, test-only fixtures used exclusively for CI. They do not grant access to production data.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic_twin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/academic_twin?schema=public
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      SEED_STUDENT_PASSWORD: CiStudent#2026x
      SEED_FACULTY_PASSWORD: CiFaculty#2026x
      E2E_STUDENT_ROLL: 24BCE0480
      E2E_STUDENT_DOB: '2005-06-15'
      E2E_STUDENT_PASSWORD: CiStudent#2026x
      E2E_FACULTY_ID: FAC001
      E2E_FACULTY_PASSWORD: CiFaculty#2026x
      E2E_ALLOW_WRITES: 'yes'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the test database (migrations + demo seed)
        run: |
          npx prisma migrate deploy
          SEED_CONFIRM_WIPE=yes npx prisma db seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  ml:
    # The 38 ML tests: feature leakage rules, training, evaluation, model cards, risk calibration,
    # the AI-vs-traditional comparison and the ML service, on synthetic OULAD-format data (no real data needed).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ML tests
        run: python -m unittest discover -s tests -v
