name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_twin?schema=public
      JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  ml:
    # The 38 ML tests: feature leakage rules, training, evaluation, model cards, risk calibration,
    # the AI-vs-traditional comparison and the ML service, on synthetic OULAD-format data (no real data needed).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ML tests
        run: python -m unittest discover -s tests -v
